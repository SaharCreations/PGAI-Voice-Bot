<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">PGAI Voice Bot Architecture</title>
  <desc id="description">The system streams a live call through Telnyx, FastAPI, Deepgram, Claude, ElevenLabs, an evidence pipeline, and a human-reviewed automatic evaluator.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040105"/>
      <stop offset="100%" stop-color="#170923"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#AEA4D4"/>
      <stop offset="50%" stop-color="#5E34A3"/>
      <stop offset="100%" stop-color="#A349A0"/>
    </linearGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#AEA4D4" stroke-opacity=".045"/>
    </pattern>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#AEA4D4"/>
    </marker>
  </defs>

  <rect width="1200" height="700" rx="28" fill="url(#background)"/>
  <rect width="1200" height="700" rx="28" fill="url(#grid)"/>

  <text x="60" y="66" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">
    Real-time voice testing pipeline
  </text>
  <text x="60" y="98" fill="#9D98AD" font-family="Inter, Arial, sans-serif" font-size="16">
    Every turn is streamed, reasoned about, spoken naturally, and preserved as reviewable evidence.
  </text>

  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(58 145)">
      <rect width="245" height="118" rx="22" fill="#D5D0E9" fill-opacity=".06" stroke="#AEA4D4" stroke-opacity=".32"/>
      <circle cx="31" cy="31" r="15" fill="#5E34A3"/>
      <text x="31" y="36" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">1</text>
      <text x="26" y="70" fill="#FFFFFF" font-size="20" font-weight="700">PGAI test line</text>
      <text x="26" y="94" fill="#9D98AD" font-size="13">Clinic agent speaks</text>
    </g>

    <g transform="translate(336 145)">
      <rect width="245" height="118" rx="22" fill="#D5D0E9" fill-opacity=".06" stroke="#AEA4D4" stroke-opacity=".32"/>
      <circle cx="31" cy="31" r="15" fill="#5E34A3"/>
      <text x="31" y="36" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">2</text>
      <text x="26" y="70" fill="#FFFFFF" font-size="20" font-weight="700">Telnyx</text>
      <text x="26" y="94" fill="#9D98AD" font-size="13">Call + bidirectional media</text>
    </g>

    <g transform="translate(614 145)">
      <rect width="245" height="118" rx="22" fill="#D5D0E9" fill-opacity=".06" stroke="#A349A0" stroke-opacity=".45"/>
      <circle cx="31" cy="31" r="15" fill="#A349A0" filter="url(#glow)"/>
      <text x="31" y="36" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">3</text>
      <text x="26" y="70" fill="#FFFFFF" font-size="20" font-weight="700">FastAPI relay</text>
      <text x="26" y="94" fill="#9D98AD" font-size="13">Session + turn orchestration</text>
    </g>

    <g transform="translate(892 145)">
      <rect width="245" height="118" rx="22" fill="#D5D0E9" fill-opacity=".06" stroke="#AEA4D4" stroke-opacity=".32"/>
      <circle cx="31" cy="31" r="15" fill="#5E34A3"/>
      <text x="31" y="36" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">4</text>
      <text x="26" y="70" fill="#FFFFFF" font-size="20" font-weight="700">Deepgram STT</text>
      <text x="26" y="94" fill="#9D98AD" font-size="13">Streaming transcription</text>
    </g>

    <path d="M303 204H326" stroke="#AEA4D4" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M581 204H604" stroke="#AEA4D4" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M859 204H882" stroke="#AEA4D4" stroke-width="2" marker-end="url(#arrow)"/>

    <path d="M1015 263V306H410V333" fill="none" stroke="#AEA4D4" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(288 344)">
      <rect width="245" height="118" rx="22" fill="#D5D0E9" fill-opacity=".06" stroke="#A349A0" stroke-opacity=".45"/>
      <circle cx="31" cy="31" r="15" fill="#A349A0" filter="url(#glow)"/>
      <text x="31" y="36" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">5</text>
      <text x="26" y="70" fill="#FFFFFF" font-size="20" font-weight="700">Claude</text>
      <text x="26" y="94" fill="#9D98AD" font-size="13">Scenario-aware reasoning</text>
    </g>

    <g transform="translate(566 344)">
      <rect width="245" height="118" rx="22" fill="#D5D0E9" fill-opacity=".06" stroke="#AEA4D4" stroke-opacity=".32"/>
      <circle cx="31" cy="31" r="15" fill="#5E34A3"/>
      <text x="31" y="36" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">6</text>
      <text x="26" y="70" fill="#FFFFFF" font-size="20" font-weight="700">ElevenLabs</text>
      <text x="26" y="94" fill="#9D98AD" font-size="13">Low-latency patient voice</text>
    </g>

    <g transform="translate(844 344)">
      <rect width="245" height="118" rx="22" fill="#D5D0E9" fill-opacity=".06" stroke="#AEA4D4" stroke-opacity=".32"/>
      <circle cx="31" cy="31" r="15" fill="#5E34A3"/>
      <text x="31" y="36" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">7</text>
      <text x="26" y="70" fill="#FFFFFF" font-size="20" font-weight="700">Patient audio</text>
      <text x="26" y="94" fill="#9D98AD" font-size="13">Paced µ-law playback</text>
    </g>

    <path d="M533 403H556" stroke="#AEA4D4" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M811 403H834" stroke="#AEA4D4" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(58 526)">
      <rect width="1079" height="118" rx="24" fill="#3A1D54" fill-opacity=".31" stroke="url(#accent)" stroke-opacity=".65"/>
      <text x="28" y="38" fill="#D5D0E9" font-size="13" font-weight="700" letter-spacing="1.6">EVIDENCE PIPELINE</text>
      <text x="28" y="74" fill="#FFFFFF" font-size="21" font-weight="700">Each completed call becomes a reproducible review package</text>

      <g transform="translate(610 25)">
        <rect width="104" height="66" rx="16" fill="#040105" fill-opacity=".55" stroke="#AEA4D4" stroke-opacity=".25"/>
        <text x="52" y="29" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">MP3</text>
        <text x="52" y="49" text-anchor="middle" fill="#9D98AD" font-size="11">recording</text>

        <rect x="116" width="104" height="66" rx="16" fill="#040105" fill-opacity=".55" stroke="#AEA4D4" stroke-opacity=".25"/>
        <text x="168" y="29" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">TXT</text>
        <text x="168" y="49" text-anchor="middle" fill="#9D98AD" font-size="11">transcript</text>

        <rect x="232" width="104" height="66" rx="16" fill="#040105" fill-opacity=".55" stroke="#AEA4D4" stroke-opacity=".25"/>
        <text x="284" y="29" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">JSON</text>
        <text x="284" y="49" text-anchor="middle" fill="#9D98AD" font-size="11">diagnostics</text>

        <rect x="348" width="104" height="66" rx="16" fill="#A349A0" fill-opacity=".16" stroke="#A349A0" stroke-opacity=".7"/>
        <text x="400" y="29" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">AI REVIEW</text>
        <text x="400" y="49" text-anchor="middle" fill="#D5D0E9" font-size="11">human checked</text>
      </g>
    </g>
  </g>
</svg>
